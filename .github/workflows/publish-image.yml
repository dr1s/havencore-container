name: Publish images to GHCR

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".env.example"
      - "docker-compose.yml"
      - "podman-compose.override.yml"
      - ".dockerignore"
      - ".gitignore"
      - ".gitattributes"
  schedule:
    - cron: "13 0 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git branch or tag of HavenWoW/BFA-HavenCore to build"
        required: false
        default: "main"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: havencore-server
            context: ./server
            file: ./server/Containerfile
            target: runtime
            is_latest: true
          - image: havencore-db-init
            context: ./db-init
            file: ./db-init/Containerfile
            is_latest: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve upstream source commit
        id: source
        run: |
          REF="${{ github.event.inputs.source_ref || 'main' }}"
          SHA="$(git ls-remote https://github.com/HavenWoW/BFA-HavenCore.git "refs/heads/${REF}" | cut -f1)"
          SHORT_SHA="${SHA:0:6}"
          if [ -z "${SHA}" ]; then
            echo "Could not resolve ref ${REF} on HavenWoW/BFA-HavenCore" >&2
            exit 1
          fi
          echo "Resolved upstream ${REF} -> ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.source.outputs.short_sha }}
            type=raw,value=latest,enable=${{ matrix.is_latest && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}

      - name: Get number of CPUs
        id: cpus
        run: echo "count=$(nproc)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: ${{ matrix.target }}
          build-args: |
            SOURCE_REPO=https://github.com/HavenWoW/BFA-HavenCore.git
            SOURCE_BRANCH=${{ github.event.inputs.source_ref || 'main' }}
            BUILD_JOBS=${{ steps.cpus.outputs.count }}
            SOURCE_COMMIT=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false
