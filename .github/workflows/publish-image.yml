name: Publish images to GHCR

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".env.example"
      - "container-compose.yml"
      - "container-compose.*.override.yml"
      - ".dockerignore"
      - ".gitignore"
      - ".gitattributes"
  schedule:
    - cron: "13 0 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git branch or tag of HavenWoW/BFA-HavenCore to build"
        required: false
        default: "main"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
    steps:
      - name: Resolve upstream source commit
        id: source
        run: |
          REF="${{ github.event.inputs.source_ref || 'main' }}"
          SHA="$(git ls-remote https://github.com/HavenWoW/BFA-HavenCore.git "refs/heads/${REF}" | cut -f1)"
          SHORT_SHA="${SHA:0:6}"
          if [ -z "${SHA}" ]; then
            echo "Could not resolve ref ${REF} on HavenWoW/BFA-HavenCore" >&2
            exit 1
          fi
          echo "Resolved upstream ${REF} -> ${SHA}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: havencore-server
            context: ./server
            file: ./server/Containerfile
            target: runtime
            platform: linux/amd64
            platform_suffix: amd64
            runner: ubuntu-latest
          - image: havencore-server
            context: ./server
            file: ./server/Containerfile
            target: runtime
            platform: linux/arm64
            platform_suffix: arm64
            runner: ubuntu-24.04-arm
          - image: havencore-db-init
            context: ./db-init
            file: ./db-init/Containerfile
            platform: linux/amd64
            platform_suffix: amd64
            runner: ubuntu-latest
          - image: havencore-db-init
            context: ./db-init
            file: ./db-init/Containerfile
            platform: linux/arm64
            platform_suffix: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: |
            latest=false
            suffix=-${{ matrix.platform_suffix }}
          tags: |
            type=raw,value=${{ needs.resolve.outputs.short_sha }}

      - name: Get number of CPUs
        id: cpus
        run: echo "count=$(nproc)" >> "$GITHUB_OUTPUT"

      - name: Build and push per-arch image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: ${{ matrix.target }}
          build-args: |
            SOURCE_REPO=https://github.com/HavenWoW/BFA-HavenCore.git
            SOURCE_BRANCH=${{ github.event.inputs.source_ref || 'main' }}
            BUILD_JOBS=${{ steps.cpus.outputs.count }}
            SOURCE_COMMIT=${{ needs.resolve.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform_suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.platform_suffix }}
          provenance: false

  manifest:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine final tags
        id: tags
        run: |
          SERVER_BASE="${{ env.REGISTRY }}/${{ github.repository_owner }}/havencore-server"
          DBINIT_BASE="${{ env.REGISTRY }}/${{ github.repository_owner }}/havencore-db-init"
          SERVER_TAGS="${SERVER_BASE}:${{ needs.resolve.outputs.short_sha }}"
          DBINIT_TAGS="${DBINIT_BASE}:${{ needs.resolve.outputs.short_sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            SERVER_TAGS="${SERVER_TAGS}"$'\n'"${SERVER_BASE}:latest"
            DBINIT_TAGS="${DBINIT_TAGS}"$'\n'"${DBINIT_BASE}:latest"
          fi
          {
            echo "server<<EOF"
            echo "${SERVER_TAGS}"
            echo "EOF"
            echo "dbinit<<EOF"
            echo "${DBINIT_TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest (server)
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: ${{ steps.tags.outputs.server }}
          sources: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/havencore-server:${{ needs.resolve.outputs.short_sha }}-amd64
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/havencore-server:${{ needs.resolve.outputs.short_sha }}-arm64

      - name: Create multi-arch manifest (db-init)
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: ${{ steps.tags.outputs.dbinit }}
          sources: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/havencore-db-init:${{ needs.resolve.outputs.short_sha }}-amd64
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/havencore-db-init:${{ needs.resolve.outputs.short_sha }}-arm64

  cleanup:
    needs: [resolve, manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Untag per-arch images (server)
        uses: ghcr-manager/ghcr-untag-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: havencore-server
          tags: |
            ${{ needs.resolve.outputs.short_sha }}-amd64
            ${{ needs.resolve.outputs.short_sha }}-arm64

      - name: Untag per-arch images (db-init)
        uses: ghcr-manager/ghcr-untag-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: havencore-db-init
          tags: |
            ${{ needs.resolve.outputs.short_sha }}-amd64
            ${{ needs.resolve.outputs.short_sha }}-arm64
